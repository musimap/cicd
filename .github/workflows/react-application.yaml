on:
  workflow_call:
    inputs:
      vite_envs:
        required: false
        type: string

jobs:
  react-ci:
    name: Test, Build, Tag & Deploy
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      id-token: write
      contents: write
      actions: read

    steps:
      # Record start time
      - name: Record start time
        id: start_time
        run: echo "started_at=$(date +%s)" >> $GITHUB_ENV

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Validate structure
      - name: Validate repository
        uses: musimap/cicd/github-actions/_partials/steps-validate-repo@main

      - name: Validate React project
        uses: musimap/cicd/github-actions/_partials/steps-validate-react@main

      # Setup Node + PNPM
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PNPM
        uses: musimap/cicd/github-actions/_partials/steps-install-pnpm@main

      # Version bump (develop)
      - name: Bump React version (develop only)
        if: github.ref == 'refs/heads/develop'
        uses: musimap/cicd/github-actions/_partials/steps-bump-react-version@main
        with:
          file: "src/package.json"

      # Get version on main
      - name: Get version (main)
        if: github.ref == 'refs/heads/main'
        id: get_version
        uses: musimap/cicd/github-actions/_partials/steps-get-react-version@main
        with:
          file: "src/package.json"

      # Debug version on main
      - name: Debug version
        if: github.ref == 'refs/heads/main'
        run: |
          echo "VERSION output = '${{ steps.get_version.outputs.VERSION }}'"

      # Export version on main
      - name: Export version to NEW_VERSION (main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: echo "NEW_VERSION=${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_ENV

      # Overlay path for Kustomize
      - name: Set overlay path
        uses: musimap/cicd/github-actions/_partials/steps-set-overlay-path@main

      # Install dependencies
      - name: Install dependencies
        working-directory: src
        run: pnpm install

      # Export given Environment Variables
      - name: Export Vite environment variables
        if: ${{ inputs.vite_envs != '' }}
        shell: bash
        run: |
          echo "Injecting Vite env variables:"
          echo "${{ inputs.vite_envs }}"
          while IFS= read -r line; do
            if [[ "$line" != "" ]]; then
              echo "$line" >> $GITHUB_ENV
            fi
          done <<< "${{ inputs.vite_envs }}"

      # Build React (inject Vite envs automatically)
      - name: Build React Application
        uses: musimap/cicd/github-actions/_partials/steps-build-react@main

      # AWS
      - name: Configure AWS
        id: aws
        uses: musimap/cicd/github-actions/_partials/steps-configure-aws@main
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      # Docker build & push
      - name: Build and push Docker image
        uses: musimap/cicd/github-actions/_partials/steps-build-docker@main
        with:
          ecr-repo: ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}
          new-version: ${{ env.NEW_VERSION }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Update Kustomize overlay
      - name: Update Kustomize
        uses: musimap/cicd/github-actions/_partials/steps-update-kustomize@main
        with:
          overlay-path: ${{ env.OVERLAY_PATH }}
          new-version: ${{ env.NEW_VERSION }}

      # Commit version + kustomize changes
      - name: Commit version & Kustomize
        uses: musimap/cicd/github-actions/_partials/steps-commit-version@main
        with:
          files: "src/package.json ${{ env.OVERLAY_PATH }}"

      # Create and push new Tag if main
      - name: Create Git tag (main)
        if: github.ref == 'refs/heads/main'
        uses: musimap/cicd/github-actions/_partials/steps-create-github-tag@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Calculate duration
      - name: Calculate duration
        id: duration-cicd
        run: |
          ended_at=$(date +%s)
          started_at=${{ env.started_at }}
          duration_cicd=$(( ended_at - started_at ))
          echo "duration_cicd=${duration_cicd}s" >> $GITHUB_OUTPUT

      # Slack notify
      - name: Send Slack notification
        uses: musimap/cicd/github-actions/_partials/steps-slack-notify@main
        with:
          service-name: ${{ github.event.repository.name }}
          version: ${{ env.NEW_VERSION }}
          status: "✅ Deployed Successfully"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          duration-cicd: ${{ steps.duration-cicd.outputs.duration_cicd }}