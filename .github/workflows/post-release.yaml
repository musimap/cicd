on:
  workflow_call:

jobs:
  post-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: read

    steps:
      - uses: musimap/cicd/github-actions/_partials/steps-checkout@main
      - uses: musimap/cicd/github-actions/_partials/steps-merge-main-into-develop@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: musimap/cicd/github-actions/_partials/steps-create-github-release@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: musimap/cicd/github-actions/_partials/steps-slack-release-success@main
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}