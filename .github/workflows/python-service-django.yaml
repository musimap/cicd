on:
  workflow_call:
    inputs:
      poetry_sources:
        required: false
        type: string
      install_ffmpeg:
        required: false
        type: boolean
        default: false
      python_version:
        required: false
        type: string
        default: "3.13"
      poetry_version:
        required: false
        type: string
        default: "1.5.1"
      # PostgreSQL service for apps that use Django ORM (e.g. vdr-app).
      # Stateless apps with a dummy DATABASES backend ignore the container.
      postgres_image:
        required: false
        type: string
        default: "postgres:16-alpine"
      postgres_db:
        required: false
        type: string
        default: "app_test"
      postgres_user:
        required: false
        type: string
        default: "app"
      postgres_password:
        required: false
        type: string
        default: "app"
      # Optional secondary deployable image owned by the same repository
      # (e.g. msm-audio-streamer Icecast). When dockerfile is set, CI builds
      # and pushes that image, then pins an immutable digest into digest_manifest.
      extra_image_dockerfile:
        required: false
        type: string
        default: ""
      extra_image_ecr_repo:
        description: ECR repository name (not full URI), e.g. msm-audio-streamer-icecast
        required: false
        type: string
        default: ""
      extra_image_digest_manifest:
        description: Manifest path whose container image field is digest-pinned
        required: false
        type: string
        default: ""
      extra_image_watch_paths:
        description: >
          Newline-separated path prefixes. When non-empty, rebuild the extra
          image only if the push touched one of them (or on workflow_dispatch).
          Empty = rebuild on every release when dockerfile is configured.
        required: false
        type: string
        default: ""

jobs:
  django-ci:
    name: Test, Build, Tag & Deploy
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_DB: ${{ inputs.postgres_db }}
          POSTGRES_USER: ${{ inputs.postgres_user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ inputs.postgres_user }} -d ${{ inputs.postgres_db }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${{ inputs.postgres_db }}
      POSTGRES_USER: ${{ inputs.postgres_user }}
      POSTGRES_PASSWORD: ${{ inputs.postgres_password }}

    steps:
      # Record start time
      - name: Record start time
        id: start_time
        run: echo "started_at=$(date +%s)" >> $GITHUB_ENV

      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Validate repository and project structure
      - name: Validate repository
        uses: musimap/cicd/github-actions/_partials/steps-validate-repo@main

      - name: Validate Python project
        uses: musimap/cicd/github-actions/_partials/steps-validate-python@main

      # Python & Poetry setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Poetry
        uses: musimap/cicd/github-actions/_partials/steps-install-poetry@main
        with:
          poetry-version: ${{ inputs.poetry_version }}

      # Optional ffmpeg setup
      - name: Install ffmpeg
        if: ${{ inputs.install_ffmpeg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmagic1

      # AWS + CodeArtifact
      - name: Configure AWS + CodeArtifact
        id: aws
        uses: musimap/cicd/github-actions/_partials/steps-configure-aws-codeartifact@main
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          codeartifact-domain: ${{ secrets.CODEARTIFACT_DOMAIN }}
          codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}

      # Configure Poetry sources dynamically (from inputs)
      - name: Configure Poetry sources (CodeArtifact)
        if: ${{ inputs.poetry_sources != '' }}
        uses: musimap/cicd/github-actions/_partials/steps-configure-poetry-sources@main
        with:
          poetry-sources: ${{ inputs.poetry_sources }}
          codeartifact-domain: ${{ secrets.CODEARTIFACT_DOMAIN }}
          codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}
          aws-region: ${{ secrets.AWS_REGION }}
          codeartifact-token: ${{ steps.aws.outputs.CODEARTIFACT_TOKEN }}

      # Dependencies & Tests
      - name: Install dependencies
        run: poetry install

      - name: Run pytest
        uses: musimap/cicd/github-actions/_partials/steps-pytest@main

      # Versioning
      - name: Bump Poetry version (develop only)
        if: github.ref == 'refs/heads/develop'
        uses: musimap/cicd/github-actions/_partials/steps-bump-poetry-version@main

      - name: Get version (main)
        if: github.ref == 'refs/heads/main'
        run: echo "NEW_VERSION=$(poetry version --short)" >> $GITHUB_ENV

      # Overlay path (Kustomize)
      - name: Set overlay path
        uses: musimap/cicd/github-actions/_partials/steps-set-overlay-path@main

      # Fix Image Tag
      - name: Compute image tag
        shell: bash
        run: |
          if [[ -z "${{ env.NEW_VERSION }}" ]]; then
            echo "NEW_VERSION is empty — aborting"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=${{ env.NEW_VERSION }}" >> $GITHUB_ENV
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "IMAGE_TAG=${{ env.NEW_VERSION }}-dev.${SHORT_SHA}" >> $GITHUB_ENV
          fi

      # Build & push Docker image
      - name: Build and push Docker image
        uses: musimap/cicd/github-actions/_partials/steps-build-docker@main
        with:
          ecr-repo: ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}
          new-version: ${{ env.IMAGE_TAG }}
          aws-region: ${{ secrets.AWS_REGION }}
          codeartifact-token: ${{ steps.aws.outputs.CODEARTIFACT_TOKEN }}

      # Optional secondary image (same release ownership, separate ECR + digest pin)
      - name: Validate secondary image inputs
        if: ${{ inputs.extra_image_dockerfile != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.extra_image_ecr_repo }}" ]]; then
            echo "extra_image_ecr_repo is required when extra_image_dockerfile is set" >&2
            exit 1
          fi
          if [[ -z "${{ inputs.extra_image_digest_manifest }}" ]]; then
            echo "extra_image_digest_manifest is required when extra_image_dockerfile is set" >&2
            exit 1
          fi
          if [[ ! -f "${{ inputs.extra_image_digest_manifest }}" ]]; then
            echo "digest manifest missing: ${{ inputs.extra_image_digest_manifest }}" >&2
            exit 1
          fi
          if [[ ! -f "${{ inputs.extra_image_dockerfile }}" ]]; then
            echo "dockerfile missing: ${{ inputs.extra_image_dockerfile }}" >&2
            exit 1
          fi

      - name: Decide whether to build secondary image
        id: extra-image
        if: ${{ inputs.extra_image_dockerfile != '' }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD=false
          if [[ -z "${{ inputs.extra_image_watch_paths }}" ]]; then
            BUILD=true
            echo "No watch paths configured → rebuild secondary image every release"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD=true
            echo "workflow_dispatch → force secondary image rebuild"
          else
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              BUILD=true
              echo "No previous SHA → rebuild secondary image"
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)
              while IFS= read -r prefix; do
                prefix=$(echo "$prefix" | sed 's/[[:space:]]*$//')
                [[ -z "$prefix" ]] && continue
                if echo "$CHANGED" | grep -q "^${prefix}"; then
                  BUILD=true
                  echo "Change under '${prefix}' → rebuild secondary image"
                  break
                fi
              done <<< "${{ inputs.extra_image_watch_paths }}"
            fi
          fi
          if [[ "$BUILD" != "true" ]]; then
            echo "Icecast/secondary build context unchanged → skip rebuild"
          fi
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Build and push secondary Docker image
        if: ${{ inputs.extra_image_dockerfile != '' && steps.extra-image.outputs.build == 'true' }}
        uses: musimap/cicd/github-actions/_partials/steps-build-docker@main
        with:
          ecr-repo: ${{ secrets.ECR_REGISTRY }}/${{ inputs.extra_image_ecr_repo }}
          new-version: ${{ env.IMAGE_TAG }}
          aws-region: ${{ secrets.AWS_REGION }}
          dockerfile: ${{ inputs.extra_image_dockerfile }}

      - name: Pin secondary image digest in manifest
        if: ${{ inputs.extra_image_dockerfile != '' && steps.extra-image.outputs.build == 'true' }}
        uses: musimap/cicd/github-actions/_partials/steps-pin-image-digest@main
        with:
          ecr-repo: ${{ secrets.ECR_REGISTRY }}/${{ inputs.extra_image_ecr_repo }}
          image-tag: ${{ env.IMAGE_TAG }}
          manifest-path: ${{ inputs.extra_image_digest_manifest }}

      # Update Kustomize tag
      - name: Update Kustomize
        uses: musimap/cicd/github-actions/_partials/steps-update-kustomize@main
        with:
          overlay-path: ${{ env.OVERLAY_PATH }}
          new-version: ${{ env.IMAGE_TAG }}
          extra-files: ${{ inputs.extra_image_digest_manifest }}

      # Commit and push changes
      - name: Commit version & Kustomize
        uses: musimap/cicd/github-actions/_partials/steps-commit-version@main
        with:
          files: "pyproject.toml ${{ env.OVERLAY_PATH }} ${{ inputs.extra_image_digest_manifest }}"

      # Create and push new Tag if main
      - name: Create Git tag (main)
        if: github.ref == 'refs/heads/main'
        uses: musimap/cicd/github-actions/_partials/steps-create-github-tag@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Calculate duration
      - name: Calculate duration
        id: duration-cicd
        run: |
          ended_at=$(date +%s)
          started_at=${{ env.started_at }}
          duration_cicd=$(( ended_at - started_at ))
          echo "duration_cicd=${duration_cicd}s" >> $GITHUB_OUTPUT

      # Slack notification
      - name: Send Slack notification
        uses: musimap/cicd/github-actions/_partials/steps-slack-notify@main
        with:
          service-name: ${{ github.event.repository.name }}
          version: ${{ env.NEW_VERSION }}
          status: "✅ Deployed Successfully"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          duration-cicd: ${{ steps.duration-cicd.outputs.duration_cicd }}
