on:
  workflow_call:
    inputs:
      poetry_sources:
        required: false
        type: string
      install_ffmpeg:
        required: false
        type: boolean
        default: false
      python_version:
        required: false
        type: string
        default: "3.13"
      poetry_version:
        required: false
        type: string
        default: "1.5.1"

jobs:
  django-ci:
    name: Test, Build, Tag & Deploy
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    
    steps:
      # Record start time
      - name: Record start time
        id: start_time
        run: echo "started_at=$(date +%s)" >> $GITHUB_ENV

      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Validate repository and project structure
      - name: Validate repository
        uses: musimap/cicd/github-actions/_partials/steps-validate-repo@main

      - name: Validate Python project
        uses: musimap/cicd/github-actions/_partials/steps-validate-python@main

      # Python & Poetry setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Poetry
        uses: musimap/cicd/github-actions/_partials/steps-install-poetry@main
        with:
          poetry-version: ${{ inputs.poetry_version }}

      # Optional ffmpeg setup
      - name: Install ffmpeg
        if: ${{ inputs.install_ffmpeg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmagic1

      # AWS + CodeArtifact
      - name: Configure AWS + CodeArtifact
        id: aws
        uses: musimap/cicd/github-actions/_partials/steps-configure-aws-codeartifact@main
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          codeartifact-domain: ${{ secrets.CODEARTIFACT_DOMAIN }}
          codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}

      # Configure Poetry sources dynamically (from inputs)
      - name: Configure Poetry sources (CodeArtifact)
        if: ${{ inputs.poetry_sources != '' }}
        uses: musimap/cicd/github-actions/_partials/steps-configure-poetry-sources@main
        with:
          poetry-sources: ${{ inputs.poetry_sources }}
          codeartifact-domain: ${{ secrets.CODEARTIFACT_DOMAIN }}
          codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}
          aws-region: ${{ secrets.AWS_REGION }}
          codeartifact-token: ${{ steps.aws.outputs.CODEARTIFACT_TOKEN }}

      # Dependencies & Tests
      - name: Install dependencies
        run: poetry install

      - name: Run pytest
        uses: musimap/cicd/github-actions/_partials/steps-pytest@main

      # Versioning
      - name: Bump Poetry version (develop only)
        if: github.ref == 'refs/heads/develop'
        uses: musimap/cicd/github-actions/_partials/steps-bump-poetry-version@main

      - name: Get version (main)
        if: github.ref == 'refs/heads/main'
        run: echo "NEW_VERSION=$(poetry version --short)" >> $GITHUB_ENV

      # Overlay path (Kustomize)
      - name: Set overlay path
        uses: musimap/cicd/github-actions/_partials/steps-set-overlay-path@main

      # Fix Image Tag
      - name: Compute image tag
        shell: bash
        run: |
          if [[ -z "${{ env.NEW_VERSION }}" ]]; then
            echo "NEW_VERSION is empty — aborting"
            exit 1
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=${{ env.NEW_VERSION }}" >> $GITHUB_ENV
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            echo "IMAGE_TAG=${{ env.NEW_VERSION }}-dev.${SHORT_SHA}" >> $GITHUB_ENV
          fi

      # Build & push Docker image
      - name: Build and push Docker image
        uses: musimap/cicd/github-actions/_partials/steps-build-docker@main
        with:
          ecr-repo: ${{ secrets.ECR_REGISTRY }}/${{ github.event.repository.name }}
          new-version: ${{ env.IMAGE_TAG }}
          aws-region: ${{ secrets.AWS_REGION }}
          codeartifact-token: ${{ steps.aws.outputs.CODEARTIFACT_TOKEN }}

      # Update Kustomize tag
      - name: Update Kustomize
        uses: musimap/cicd/github-actions/_partials/steps-update-kustomize@main
        with:
          overlay-path: ${{ env.OVERLAY_PATH }}
          new-version: ${{ env.IMAGE_TAG }}

      # Commit and push changes
      - name: Commit version & Kustomize
        uses: musimap/cicd/github-actions/_partials/steps-commit-version@main
        with:
          files: "pyproject.toml ${{ env.OVERLAY_PATH }}"

      # Create and push new Tag if main
      - name: Create Git tag (main)
        if: github.ref == 'refs/heads/main'
        uses: musimap/cicd/github-actions/_partials/steps-create-github-tag@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Calculate duration
      - name: Calculate duration
        id: duration-cicd
        run: |
          ended_at=$(date +%s)
          started_at=${{ env.started_at }}
          duration_cicd=$(( ended_at - started_at ))
          echo "duration_cicd=${duration_cicd}s" >> $GITHUB_OUTPUT

      # Slack notification
      - name: Send Slack notification
        uses: musimap/cicd/github-actions/_partials/steps-slack-notify@main
        with:
          service-name: ${{ github.event.repository.name }}
          version: ${{ env.NEW_VERSION }}
          status: "✅ Deployed Successfully"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          duration-cicd: ${{ steps.duration-cicd.outputs.duration_cicd }}