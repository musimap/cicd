on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build, Test, Version, and Publish

    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Validate repository and project structure
      - name: Validate repository
        uses: musimap/cicd/github-actions/_partials/steps-validate-repo.yaml@main

      - name: Validate Python project
        uses: musimap/cicd/github-actions/_partials/steps-validate-python.yaml@main

      # Python & Poetry setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: musimap/cicd/github-actions/_partials/steps-install-poetry.yaml@main
        with:
          poetry-version: "1.5.1"

      # AWS + CodeArtifact
      - name: Configure AWS + CodeArtifact
        id: aws
        uses: musimap/cicd/github-actions/_partials/steps-configure-aws.yaml@main
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-role: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          codeartifact-domain: ${{ secrets.CODEARTIFACT_DOMAIN }}
          codeartifact-domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}

      # Dependencies & Tests
      - name: Install dependencies
        run: poetry install

      - name: Run pytest
        uses: musimap/cicd/github-actions/_partials/steps-pytest.yaml@main

      # Bump version
      - name: Bump Poetry version
        uses: musimap/cicd/github-actions/_partials/steps-bump-poetry-version.yaml@main

      # Commit and push new version
      - name: Commit version bump
        uses: musimap/cicd/github-actions/_partials/steps-commit-version.yaml@main
        with:
          files: "pyproject.toml"

      # Build package
      - name: Build package
        run: poetry build

      # Publish to AWS CodeArtifact
      - name: Publish package
        uses: musimap/cicd/github-actions/_partials/steps-publish-codeartifact.yaml@main
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          domain: ${{ secrets.CODEARTIFACT_DOMAIN }}
          domain-owner: ${{ secrets.CODEARTIFACT_DOMAIN_OWNER }}

      # Slack notification
      - name: Send Slack notification
        uses: musimap/cicd/github-actions/_partials/steps-slack-notify.yaml@main
        with:
          service-name: ${{ github.event.repository.name }}
          version: ${{ env.NEW_VERSION }}
          status: "📦 Package Published"
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}