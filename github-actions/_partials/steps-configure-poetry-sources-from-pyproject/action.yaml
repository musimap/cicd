name: Configure Poetry sources from pyproject (CodeArtifact only)
description: Reads pyproject.toml, finds CodeArtifact sources by host, and injects auth tokens for those sources only.

inputs:
  aws-region:
    required: true
  codeartifact-domain:
    required: true
  codeartifact-domain-owner:
    required: true

runs:
  using: "composite"
  steps:
    - name: Read pyproject and list CodeArtifact source names
      id: list_sources
      shell: bash
      env:
        CA_DOMAIN: ${{ inputs.codeartifact-domain }}
        CA_OWNER: ${{ inputs.codeartifact-domain-owner }}
        CA_REGION: ${{ inputs.aws-region }}
      run: |
        # prints a comma-separated list of Poetry source names whose URL host matches the CodeArtifact host
        SOURCES=$(python3 -c '
import os, sys
import tomllib
from urllib.parse import urlparse

host = f"{os.environ["CA_DOMAIN"]}-{os.environ["CA_OWNER"]}.d.codeartifact.{os.environ["CA_REGION"]}.amazonaws.com"
try:
    with open("pyproject.toml","rb") as f:
        data = tomllib.load(f)
except FileNotFoundError:
    print("", end="")
    sys.exit(0)

names = []
for src in data.get("tool",{}).get("poetry",{}).get("source",[]):
    url, name = src.get("url"), src.get("name")
    if not url or not name:
        continue
    if urlparse(url).netloc.lower() == host:
        names.append(name)
print(",".join(names), end="")
')
        echo "SOURCES=${SOURCES}"
        echo "SOURCES=${SOURCES}" >> "$GITHUB_ENV"
        echo "sources=${SOURCES}" >> "$GITHUB_OUTPUT"

    - name: Skip if no CodeArtifact sources
      if: steps.list_sources.outputs.sources == ''
      shell: bash
      run: echo "::notice::No CodeArtifact Poetry sources found to configure."

    - name: Inject credentials into Poetry (only matching sources)
      if: steps.list_sources.outputs.sources != ''
      shell: bash
      run: |
        if [ -z "${CODEARTIFACT_TOKEN:-}" ]; then
          echo "::error::CODEARTIFACT_TOKEN is missing (ensure steps-configure-aws ran earlier)."
          exit 1
        fi

        IFS=',' read -ra NAMES <<< "${{ steps.list_sources.outputs.sources }}"
        for NAME in "${NAMES[@]}"; do
          echo "🔐 Configuring http-basic for Poetry source: ${NAME}"
          poetry config "http-basic.${NAME}" aws "$CODEARTIFACT_TOKEN"
        done