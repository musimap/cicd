name: Validate React project
description: Basic checks for React project structure

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        test -f src/package.json || { echo "❌ package.json missing"; exit 1; }
        test -f src/vite.config.ts || { echo "❌ vite.config.ts missing"; exit 1; }
        echo "React project validated ✔"