name: Create new tag on GitHub
description: Create and push a new git tag for the current version.

inputs:
  github_token:
    required: true
    description: GitHub token for authentication

runs:
  using: "composite"
  steps:
    - name: Create and push git tag (main)
      if: github.ref == 'refs/heads/main'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        # Ensure we have a version
        if [ -z "${NEW_VERSION:-}" ]; then
          if command -v poetry >/dev/null 2>&1; then
            NEW_VERSION="$(poetry version --short)"
          else
            echo "NEW_VERSION is not set and Poetry is not available to compute it." >&2
            exit 1
          fi
        fi

        TAG="v${NEW_VERSION}"

        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        # tags already exist? skip (idempotent)
        git fetch --tags

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists; skipping."
          exit 0
        fi

        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"