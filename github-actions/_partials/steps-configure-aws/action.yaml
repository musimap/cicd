name: Configure AWS credentials
description: Sets up AWS credentials with role assumption

inputs:
  aws-region:
    required: true
  aws-role:
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}