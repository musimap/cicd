name: Configure AWS & CodeArtifact (auto from pyproject.toml)
description: Configures AWS credentials and sets up Poetry sources dynamically from pyproject.toml, restricted to CodeArtifact host

inputs:
  aws-region:
    required: true
  aws-role:
    required: true
  codeartifact-domain:
    required: true
  codeartifact-domain-owner:
    required: true

outputs:
  CODEARTIFACT_TOKEN:
    description: AWS CodeArtifact token
    value: ${{ steps.token.outputs.CODEARTIFACT_TOKEN }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Get CodeArtifact token
      id: token
      shell: bash
      run: |
        TOKEN=$(aws codeartifact get-authorization-token \
          --domain "${{ inputs.codeartifact-domain }}" \
          --domain-owner "${{ inputs.codeartifact-domain-owner }}" \
          --region "${{ inputs.aws-region }}" \
          --query authorizationToken --output text)
        echo "CODEARTIFACT_TOKEN=$TOKEN" >> $GITHUB_ENV
        echo "CODEARTIFACT_TOKEN=$TOKEN" >> $GITHUB_OUTPUT

    - name: Configure Poetry sources from pyproject.toml (CodeArtifact only)
      shell: bash
      run: |
        if [ ! -f pyproject.toml ]; then
          echo "ℹ️ No pyproject.toml found — skipping Poetry source config."
          exit 0
        fi

        python3 - <<'PYCODE'
import os, sys
import tomllib
from urllib.parse import urlparse
import subprocess

region = os.getenv("INPUT_AWS-REGION") or os.getenv("INPUT_AWS_REGION") or "${{ inputs.aws-region }}"
domain = os.getenv("INPUT_CODEARTIFACT-DOMAIN") or os.getenv("INPUT_CODEARTIFACT_DOMAIN") or "${{ inputs.codeartifact-domain }}"
owner  = os.getenv("INPUT_CODEARTIFACT-DOMAIN-OWNER") or os.getenv("INPUT_CODEARTIFACT_DOMAIN_OWNER") or "${{ inputs.codeartifact-domain-owner }}"
token  = os.getenv("CODEARTIFACT_TOKEN")

expected_host = f"{domain}-{owner}.d.codeartifact.{region}.amazonaws.com"

with open("pyproject.toml", "rb") as f:
    data = tomllib.load(f)

sources = (data.get("tool", {})
              .get("poetry", {})
              .get("source", []))

if not sources:
    print("ℹ️ No [tool.poetry.source] entries — nothing to configure.")
    sys.exit(0)

configured = 0
for src in sources:
    name = src.get("name")
    url  = src.get("url")
    if not name or not url:
        continue

    netloc = urlparse(url).netloc
    # Only touch sources pointing to THIS CodeArtifact host
    if netloc != expected_host:
        print(f"↷ Skipping non-CodeArtifact source '{name}' ({netloc})")
        continue

    print(f"✅ Configuring CodeArtifact source '{name}' → {url}")
    subprocess.run(["poetry", "config", f"repositories.{name}", url], check=False)
    subprocess.run(["poetry", "config", f"http-basic.{name}", "aws", token], check=False)
    configured += 1

print(f"Done. Configured {configured} CodeArtifact source(s).")
PYCODE