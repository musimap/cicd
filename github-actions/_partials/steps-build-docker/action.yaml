name: Build and Push Docker Image
description: Build and push Docker image to ECR, with optional CodeArtifact token + auto VITE/NEXT_PUBLIC args

inputs:
  ecr-repo:
    required: true
  new-version:
    required: true
  aws-region:
    required: true
  codeartifact-token:
    required: false

runs:
  using: "composite"
  steps:
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker image
      shell: bash
      run: |
        echo "Preparing Docker build args..."

        BUILD_ARGS=""

        # 1) Optional CodeArtifact token
        if [[ -n "${{ inputs.codeartifact-token }}" ]]; then
          echo "→ Injecting CodeArtifact token"
          BUILD_ARGS="$BUILD_ARGS --build-arg CODEARTIFACT_AUTH_TOKEN=${{ inputs.codeartifact-token }}"
        else
          echo "→ No CodeArtifact token"
        fi

        # 2) Auto-inject frontend variables (VITE_* and NEXT_PUBLIC_*)
        echo "→ Checking for VITE_* and NEXT_PUBLIC_* environment variables..."
        while IFS='=' read -r key value; do
          echo "   Injecting build arg: $key"
          BUILD_ARGS="$BUILD_ARGS --build-arg $key=$value"
        done < <(env | awk -F= '$1 ~ /^(VITE_|NEXT_PUBLIC_)/ { print $0 }')

        echo "Final build args: $BUILD_ARGS"

        echo "Running Docker build..."
        docker build \
          $BUILD_ARGS \
          -t ${{ inputs.ecr-repo }}:${{ inputs.new-version }} \
          .

        echo "Pushing version tag..."
        docker push ${{ inputs.ecr-repo }}:${{ inputs.new-version }}

        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Tagging prod-latest"
          docker tag ${{ inputs.ecr-repo }}:${{ inputs.new-version }} ${{ inputs.ecr-repo }}:prod-latest
          docker push ${{ inputs.ecr-repo }}:prod-latest
        else
          echo "Tagging dev-latest"
          docker tag ${{ inputs.ecr-repo }}:${{ inputs.new-version }} ${{ inputs.ecr-repo }}:dev-latest
          docker push ${{ inputs.ecr-repo }}:dev-latest
        fi