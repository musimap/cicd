name: Update Kustomize with new version
description: Updates image tag in Kustomize and commits

inputs:
  overlay-path:
    required: true
  new-version:
    required: true
  extra-files:
    description: Optional space-separated extra paths to include in the release commit (e.g. digest-pinned manifests)
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install yq
      shell: bash
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq

    - name: Update image tag
      shell: bash
      run: |
        yq e -i '.images[0].newTag = "${{ inputs.new-version }}"' "${{ inputs.overlay-path }}"

    - name: Commit and push changes
      shell: bash
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        FILES_TO_COMMIT="${{ inputs.overlay-path }}"

        # Python project
        if [ -f "pyproject.toml" ]; then
          FILES_TO_COMMIT="$FILES_TO_COMMIT pyproject.toml"
        fi

        # React project
        if [ -f "src/package.json" ]; then
          FILES_TO_COMMIT="$FILES_TO_COMMIT src/package.json"
        fi

        # Optional secondary artifact pins (e.g. Icecast digest manifest)
        if [ -n "${{ inputs.extra-files }}" ]; then
          FILES_TO_COMMIT="$FILES_TO_COMMIT ${{ inputs.extra-files }}"
        fi

        git add $FILES_TO_COMMIT
        git commit -m "[skip ci] Release ${NEW_VERSION} (image ${{ inputs.new-version }})" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref }}
