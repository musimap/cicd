name: Bump React Version
description: Updates React package.json version based on commit message tags ([init], [patch], [minor], [major])

inputs:
  file:
    required: true
    description: Path to package.json

runs:
  using: composite
  steps:
    - name: Bump version
      id: bump
      shell: bash
      run: |
        FILE="${{ inputs.file }}"
        COMMIT_MSG="${{ github.event.head_commit.message }}"

        CURRENT=$(jq -r '.version' "$FILE")
        IFS='.' read -r major minor patch <<< "$CURRENT"

        # Determine bump type
        if echo "$COMMIT_MSG" | grep -qi "\[init\]"; then
          NEW="0.1.0"
        elif echo "$COMMIT_MSG" | grep -qi "\[major\]"; then
          major=$((major+1)); minor=0; patch=0
          NEW="$major.$minor.$patch"
        elif echo "$COMMIT_MSG" | grep -qi "\[minor\]"; then
          minor=$((minor+1)); patch=0
          NEW="$major.$minor.$patch"
        elif echo "$COMMIT_MSG" | grep -qi "\[patch\]"; then
          patch=$((patch+1))
          NEW="$major.$minor.$patch"
        else
          # Default bump = patch
          patch=$((patch+1))
          NEW="$major.$minor.$patch"
        fi

        # Apply bump
        jq --arg v "$NEW" '.version = $v' "$FILE" > tmp && mv tmp "$FILE"

        # Export version
        echo "NEW_VERSION=$NEW" >> $GITHUB_ENV
        echo "version=$NEW" >> $GITHUB_OUTPUT
        echo "🔖 Bumped to version $NEW"